name: Build LLVM for PowerPC 32-bit

# Cross-compiles LLVM, Clang and LLD (plus zlib/zstd) for $TARGET using the
# scripts in zig-build (https://codeberg.org/emanspeaks/zig-build), and
# publishes the static-library install prefix for emanspeaks/powerzig.
#
# All build logic lives in zig-build; this workflow only schedules it, carries
# results between jobs, and publishes. Each release carries a manifest.json from
# zig-build/cross-manifest.sh. A run builds only if no existing release has the
# same llvm_key, i.e. only when an input that affects LLVM actually changed.
#
# Jobs:
#   prepare  resolve the zig-build commit, compute keys, skip if already released
#   host     stage3 zig for the runner (cached by host_key)
#   llvm-1   cross LLVM build; stops itself before the 6h job limit, saving ccache
#   llvm-2   resumes from llvm-1's ccache if llvm-1 did not finish
#   publish  package the install prefix + manifest.json as release vN

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zig_build_ref:
        description: zig-build branch, tag or commit to build from
        type: string
        default: main
      force:
        description: Build and release even if a release with this llvm_key exists
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ZIG_BUILD_URL: https://codeberg.org/emanspeaks/zig-build.git
  TARGET: powerpc-linux-musleabihf
  CPU: baseline
  # anything built here moves between runners, so it must run on any x86_64 cpu
  ZIG_HOST_CPU: baseline
  STAGE3_TESTS: 0
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: true
  CCACHE_MAXSIZE: 6G
  CCACHE_COMPRESS: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zig_build_commit: ${{ steps.keys.outputs.zig_build_commit }}
      host_key: ${{ steps.keys.outputs.host_key }}
      llvm_key: ${{ steps.keys.outputs.llvm_key }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out zig-build
        run: bash .github/scripts/clone-zig-build.sh "${{ inputs.zig_build_ref || 'main' }}"

      - name: Compute keys
        id: keys
        working-directory: zig-build
        run: |
          # plain assignments so a missing/failing script fails the step
          COMMIT=$(git rev-parse HEAD)
          HOST_KEY=$(bash ./cross-manifest.sh key host)
          LLVM_KEY=$(bash ./cross-manifest.sh key llvm "$TARGET" "$CPU")
          [ -n "$HOST_KEY" ] && [ -n "$LLVM_KEY" ] || { echo "::error::empty key"; exit 1; }
          {
            echo "zig_build_commit=$COMMIT"
            echo "host_key=$HOST_KEY"
            echo "llvm_key=$LLVM_KEY"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Skip if this llvm_key is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_KEY: ${{ steps.keys.outputs.llvm_key }}
        run: |
          FOUND=""
          for TAG in $(gh release list -R "$GITHUB_REPOSITORY" -L 30 --json tagName -q '.[].tagName'); do
            KEY=$(gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p manifest.json -O - 2>/dev/null \
              | jq -r '.llvm_key // empty' || true)
            # releases from before the zig-build rework have no manifest (empty KEY)
            if [ -n "$KEY" ] && [ "$KEY" = "$LLVM_KEY" ]; then FOUND=$TAG; break; fi
          done
          if [ -n "$FOUND" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::llvm_key unchanged; already released as $FOUND"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  host:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - name: Restore stage3
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: zig-build/bin/stage3
          key: stage3-${{ needs.prepare.outputs.host_key }}

      - name: Build stage3
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: zig-build
        run: bash ./build-stage3.sh

      - name: Save stage3
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: zig-build/bin/stage3
          key: stage3-${{ needs.prepare.outputs.host_key }}

      - name: Package stage3
        run: tar -cf stage3.tar -C zig-build/bin stage3

      - uses: actions/upload-artifact@v4
        with:
          name: stage3
          path: stage3.tar
          retention-days: 2

  llvm-1:
    needs: [prepare, host]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: stage3
      - name: Unpack stage3
        run: tar -xf stage3.tar -C zig-build/bin

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-1
          restore-keys: |
            ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-

      - name: Build cross LLVM (stops after 5h20m to leave time to save ccache)
        id: build
        working-directory: zig-build
        run: |
          set +e
          CCACHE=ccache timeout 320m bash ./build-llvm-cross.sh "$TARGET" "$CPU"
          rc=$?
          set -e
          ccache -s
          case $rc in
            0) echo "done=true" >> "$GITHUB_OUTPUT";;
            124) echo "::notice::time limit reached; llvm-2 resumes from ccache"; echo "done=false" >> "$GITHUB_OUTPUT";;
            *) exit $rc;;
          esac

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-1

      - name: Package install prefix
        if: steps.build.outputs.done == 'true'
        run: tar -cJf "llvm-$TARGET-$CPU.tar.xz" -C zig-build/build/cross "$TARGET-$CPU"

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.done == 'true'
        with:
          name: llvm-prefix
          path: llvm-${{ env.TARGET }}-${{ env.CPU }}.tar.xz
          retention-days: 2

  llvm-2:
    needs: [prepare, llvm-1]
    if: needs.llvm-1.result == 'success' && needs.llvm-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: stage3
      - name: Unpack stage3
        run: tar -xf stage3.tar -C zig-build/bin

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-1
          restore-keys: |
            ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-

      - name: Finish cross LLVM
        working-directory: zig-build
        run: |
          CCACHE=ccache bash ./build-llvm-cross.sh "$TARGET" "$CPU"
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-2

      - name: Package install prefix
        run: tar -cJf "llvm-$TARGET-$CPU.tar.xz" -C zig-build/build/cross "$TARGET-$CPU"

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-prefix
          path: llvm-${{ env.TARGET }}-${{ env.CPU }}.tar.xz
          retention-days: 2

  publish:
    needs: [prepare, llvm-1, llvm-2]
    if: >-
      always() &&
      needs.prepare.outputs.should_build == 'true' &&
      (needs.llvm-1.outputs.done == 'true' || needs.llvm-2.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out zig-build
        run: bash .github/scripts/clone-zig-build.sh "${{ needs.prepare.outputs.zig_build_commit }}"

      - uses: actions/download-artifact@v4
        with:
          name: llvm-prefix

      - name: Write manifest
        working-directory: zig-build
        run: bash ./cross-manifest.sh json "$TARGET" "$CPU" > ../manifest.json && cat ../manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # count tags too: deleting a release leaves its tag, which must not be reused
          LATEST=$( { gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName -q '.[].tagName'
                      gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate -q '.[].ref | ltrimstr("refs/tags/")'
                    } | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1)
          TAG="v$(( ${LATEST:-0} + 1 ))"
          jq -r '"Cross LLVM/Clang/LLD install prefix for `\(.target)` (`\(.cpu)`), built by " +
            "[zig-build `\(.zig_build_commit[0:12])`](https://codeberg.org/emanspeaks/zig-build/src/commit/\(.zig_build_commit)).\n\n" +
            "| Field | Value |\n|---|---|\n" +
            "| LLVM sources (zig-bootstrap) | `\(.zig_bootstrap_commit[0:12])` |\n" +
            "| Devkit | `\(.devkit_version)` |\n" +
            "| llvm_key | `\(.llvm_key)` |\n\n" +
            "`manifest.json` lists every input. Consumed by emanspeaks/powerzig."' manifest.json > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "LLVM for $TARGET $TAG" \
            --notes-file notes.md \
            "llvm-$TARGET-$CPU.tar.xz" manifest.json
